<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="light">
  <title>Menstrual Health Chatbot</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Force light mode — prevent browser dark mode override */
    :root {
      color-scheme: light only;

      --page-bg:      #f0e9e4;
      --app-bg:       #ffffff;
      --chat-bg:      #f7f2ef;
      --header-bg:    #ffffff;
      --composer-bg:  #ffffff;

      --rose:         #c97b7b;
      --rose-light:   #f5e6e3;
      --rose-mid:     #deb0aa;
      --terracotta:   #a85448;
      --terracotta2:  #c4685a;

      --text:         #1e1414;
      --text2:        #5c3f3f;
      --muted:        #9c7070;

      --border:       #e5d4cf;
      --border2:      #f0e4e0;

      --green:        #4a7c5e;
      --green-light:  #d8ede3;
      --amber:        #b87a30;
      --amber-light:  #fdecd8;

      --shadow:       rgba(168, 84, 72, 0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--page-bg) !important;
      color: var(--text) !important;
    }

    body {
      font-family: 'Nunito', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }

    /* ── App card ── */
    .app {
      width: 100%;
      max-width: 820px;
      height: calc(100vh - 32px);
      max-height: 860px;
      background: var(--app-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow:
        0 2px 8px var(--shadow),
        0 12px 40px var(--shadow);
    }

    /* ── Header ── */
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border2);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--rose-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    header h1 {
      font-family: 'Lora', serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--terracotta);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .header-pill {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--rose-light);
      color: var(--terracotta);
      border: 1px solid var(--rose-mid);
      letter-spacing: 0.2px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--chat-bg);
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--rose-mid); border-radius: 4px; }

    /* ── Rows ── */
    .row { display: flex; }
    .row.you { justify-content: flex-end; }
    .row.bot { flex-direction: column; align-items: flex-start; }
    .row.sys { justify-content: flex-start; }

    /* ── Bot wrap (avatar + bubble) ── */
    .bot-wrap {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      max-width: 82%;
    }

    .bot-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--rose-light);
      border: 1.5px solid var(--rose-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ── Bubbles ── */
    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
    }

    /* User */
    .you .bubble {
      background: var(--terracotta);
      color: #fff;
      border-radius: 18px 4px 18px 18px;
      max-width: 75%;
    }

    /* Bot */
    .bot-wrap .bubble {
      background: var(--app-bg);
      border: 1px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      box-shadow: 0 1px 4px var(--shadow);
    }

    /* System */
    .sys .bubble {
      background: var(--amber-light);
      border: 1px solid #f0cfa0;
      border-left: 3px solid var(--amber);
      border-radius: 8px;
      color: #7a4a18;
      font-size: 13px;
      max-width: 88%;
      padding: 10px 13px;
    }

    .error .bubble {
      background: #fde8e8;
      border: 1px solid #f5b8b8;
      border-radius: 8px;
      color: #8a2020;
      font-size: 13px;
    }

    /* ── FR10: Myth/Fact card ── */
    .myth-card {
      border-radius: 4px 18px 18px 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.65;
      box-shadow: 0 1px 4px var(--shadow);
    }

    .myth-section {
      background: #fdf0f0;
      border-bottom: 1px solid #f5cece;
      padding: 12px 15px;
    }

    .fact-section {
      background: var(--green-light);
      padding: 12px 15px;
    }

    .myth-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 9px;
      border-radius: 20px;
      background: #f5cece;
      color: #7a2020;
      margin-bottom: 7px;
    }

    .fact-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 9px;
      border-radius: 20px;
      background: #b8dfc8;
      color: #1e4a30;
      margin-bottom: 7px;
    }

    .myth-section p, .fact-section p { margin: 0; color: var(--text); }
    .myth-body { padding: 4px 0; color: var(--text); }

    /* ── FR09: Feedback bar ── */
    .feedback-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 6px;
      padding-left: 39px;
    }

    .feedback-label {
      font-size: 11px;
      color: var(--muted);
    }

    .thumb-btn {
      background: var(--app-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 9px;
      cursor: pointer;
      font-size: 13px;
      color: var(--muted);
      transition: all 0.15s;
      line-height: 1;
    }

    .thumb-btn:hover { border-color: var(--rose); background: var(--rose-light); }
    .thumb-btn.active-up { border-color: var(--green); background: var(--green-light); }
    .thumb-btn.active-down { border-color: var(--rose); background: var(--rose-light); }

    .feedback-thanks { font-size: 11px; color: var(--green); }

    /* ── Facts card ── */
    .facts-card {
      background: var(--app-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--terracotta2);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 12px;
      color: var(--text2);
      max-width: 84%;
    }

    .facts-title {
      font-weight: 600;
      color: var(--terracotta);
      margin-bottom: 6px;
      font-size: 12px;
    }

    .facts-list {
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    /* ── Typing ── */
    .typing {
      font-size: 13px;
      color: var(--muted);
      padding: 10px 14px;
      background: var(--app-bg);
      border: 1px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      display: inline-block;
    }

    .dots { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: middle; }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--rose-mid);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-5px); }
    }

    /* ── Suggestion chips ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      font-size: 12px;
      padding: 5px 13px;
      border-radius: 20px;
      background: var(--rose-light);
      border: 1px solid var(--rose-mid);
      color: var(--terracotta);
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: background 0.15s, color 0.15s;
    }

    .chip:hover { background: var(--rose-mid); color: #fff; }

    /* ── Composer ── */
    .composer {
      background: var(--composer-bg);
      border-top: 1px solid var(--border2);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
    }

    .inputRow { display: flex; gap: 8px; align-items: center; }

    #msg {
      flex: 1;
      padding: 11px 16px;
      border-radius: 24px;
      border: 1.5px solid var(--border);
      background: var(--chat-bg);
      color: var(--text);
      font-size: 14px;
      font-family: 'Nunito', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    #msg:focus { border-color: var(--rose-mid); }
    #msg::placeholder { color: var(--muted); }

    #send {
      padding: 11px 22px;
      border-radius: 24px;
      border: none;
      background: var(--terracotta);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: 'Nunito', sans-serif;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    #send:hover   { background: var(--terracotta2); }
    #send:active  { transform: scale(0.97); }
    #send:disabled { background: var(--rose-mid); cursor: not-allowed; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .controls label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .controls input[type="checkbox"] { accent-color: var(--terracotta); }

    #statusBadge { color: var(--green); font-size: 11px; }

    /* ── Prose styles inside bubbles ── */
    .bubble ul { padding-left: 18px; margin-top: 4px; }
    .bubble li { margin-bottom: 3px; }

    @media (max-width: 600px) {
      body { padding: 0; }
      .app { border-radius: 0; height: 100vh; max-height: none; }
      .bot-wrap { max-width: 94%; }
      .you .bubble { max-width: 88%; }
      .header-pill { display: none; }
    }

    .culture-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .culture-label {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    #cultureSelect {
      font-size: 12px;
      font-family: Nunito, sans-serif;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--chat-bg);
      color: var(--text2);
      outline: none;
      cursor: pointer;
    }
    #cultureSelect:focus { border-color: var(--rose-mid); }

    /* XAI Explainability Panel */
    .xai-panel {
      position: fixed;
      top: 0; right: 0;
      width: 320px;
      height: 100vh;
      background: var(--app-bg);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 20px var(--shadow);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 100;
    }
    .xai-panel.open { transform: translateX(0); }

    .xai-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .xai-title {
      font-family: 'Lora', serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--terracotta);
    }
    .xai-close {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--muted);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .xai-close:hover { background: var(--rose-light); }

    .xai-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .xai-empty {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-top: 40px;
    }

    .xai-section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 600;
      margin: 14px 0 8px;
    }

    .xai-fact {
      font-size: 12px;
      color: var(--text2);
      padding: 8px 10px;
      background: var(--chat-bg);
      border-radius: 8px;
      border-left: 3px solid var(--rose-mid);
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .xai-concept {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--rose-light);
      color: var(--terracotta);
      border: 1px solid var(--rose-mid);
      margin-bottom: 10px;
    }

    .xai-source-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .xai-source {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--green-light);
      color: var(--green);
      border: 1px solid #b8dfc8;
    }

    .xai-btn {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--chat-bg);
      color: var(--text2);
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: all 0.15s;
    }
    .xai-btn:hover { border-color: var(--terracotta); color: var(--terracotta); }
    .xai-btn.active { background: var(--rose-light); border-color: var(--rose-mid); color: var(--terracotta); }
  </style>
</head>

<body>
<div class="app">

  <header>
    <div class="header-icon">&#127800;</div>
    <div>
      <h1>Menstrual Health Chatbot</h1>
      <div class="subtitle">Ontology-driven &bull; Culturally aware &bull; Grounded responses</div>
    </div>
    <span class="header-pill">Sri Lanka</span>
    <button class="xai-btn" id="xaiToggle" title="View explainability panel">&#128269; Explain</button>
  </header>

  <div id="chat"></div>

  <div class="composer">
    <div class="culture-row">
      <label class="culture-label">Cultural context:</label>
      <select id="cultureSelect">
        <option value="general">General</option>
        <option value="sri_lankan" selected>Sri Lankan</option>
        <option value="south_asian">South Asian</option>
        <option value="western">Western</option>
        <option value="conservative">Conservative</option>
      </select>
    </div>
    <div class="inputRow">
      <input id="msg" type="text" placeholder="Ask a menstrual health question..." autocomplete="off"/>
      <button id="send" disabled>Send</button>
    </div>
    <div class="controls">
      <label><input type="checkbox" id="showFacts"> Show ontology facts</label>
      <span id="sessionBadge">Session: &mdash;</span>
      <span id="statusBadge">&#9679; Ready</span>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

<!-- XAI Explainability Panel -->
<div class="xai-panel" id="xaiPanel">
  <div class="xai-header">
    <span class="xai-title">&#128269; How I answered</span>
    <button class="xai-close" id="xaiClose">&#x2715;</button>
  </div>
  <div class="xai-body" id="xaiBody">
    <div class="xai-empty">Send a message to see which ontology facts were used to generate the response.</div>
  </div>
</div>

<script>
  // XAI Panel logic
  const xaiPanel  = document.getElementById("xaiPanel");
  const xaiToggle = document.getElementById("xaiToggle");
  const xaiClose  = document.getElementById("xaiClose");
  const xaiBody   = document.getElementById("xaiBody");

  xaiToggle.addEventListener("click", function() {
    xaiPanel.classList.toggle("open");
    xaiToggle.classList.toggle("active");
  });
  xaiClose.addEventListener("click", function() {
    xaiPanel.classList.remove("open");
    xaiToggle.classList.remove("active");
  });

  // Called from app.js after each response
  window.updateXAIPanel = function(concept, facts, culture) {
    if (!facts || facts.length === 0) return;

    let html = "";

    if (concept) {
      html += "<div class=\'xai-concept\'>" + concept + "</div>";
    }

    if (culture && culture !== "general") {
      html += "<div class=\'xai-section-label\'>Cultural context</div>";
      html += "<div class=\'xai-fact\'>" + culture.replace("_", " ").replace(/\b\w/g, l => l.toUpperCase()) + "</div>";
    }

    html += "<div class=\'xai-section-label\'>Ontology facts retrieved</div>";

    // Filter out bare Concept: lines for display
    const displayFacts = facts.filter(f => !f.toLowerCase().startsWith("concept:"));
    displayFacts.slice(0, 8).forEach(function(f) {
      html += "<div class=\'xai-fact\'>" + f + "</div>";
    });

    // Extract sources
    const sources = new Set();
    facts.join(" ").replace(/Source:\s*([^.]+)/gi, function(_, s) {
      s.split(",").forEach(function(src) {
        const t = src.trim();
        if (t) sources.add(t);
      });
    });
    // Default sources from our ontology
    ["WHO", "NHS", "MedlinePlus"].forEach(s => sources.add(s));

    if (sources.size > 0) {
      html += "<div class=\'xai-section-label\'>Knowledge sources</div>";
      html += "<div class=\'xai-source-row\'>";
      sources.forEach(function(s) {
        html += "<span class=\'xai-source\'>" + s + "</span>";
      });
      html += "</div>";
    }

    html += "<div class=\'xai-section-label\'>Why this is safe</div>";
    html += "<div class=\'xai-fact\'>Responses are generated only from ontology-retrieved facts. The LLM is used for language polishing only, not fact generation. A verification layer checks grounding before the response is shown.</div>";

    xaiBody.innerHTML = html.replaceAll("\'", "\"");

    // Panel stays closed unless user clicks Explain — respects optional toggle design
  };
</script>
</body>
</html>
