<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="light">
  <title>Menstrual Health Chatbot</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light only;

      --page-bg:      #f0e9e4;
      --app-bg:       #ffffff;
      --chat-bg:      #f7f2ef;
      --header-bg:    #ffffff;
      --composer-bg:  #ffffff;

      --rose:         #c97b7b;
      --rose-light:   #f5e6e3;
      --rose-mid:     #d59a94;
      --terracotta:   #a85448;
      --terracotta2:  #c4685a;

      --text:         #1e1414;
      --text2:        #4b3232;
      --muted:        #7b5555;

      --border:       #e5d4cf;
      --border2:      #f0e4e0;

      --green:        #3c6c50;
      --green-light:  #d8ede3;
      --amber:        #b87a30;
      --amber-light:  #fdecd8;

      --shadow:       rgba(168, 84, 72, 0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--page-bg) !important;
      color: var(--text) !important;
    }

    body {
      font-family: 'Nunito', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 820px;
      height: calc(100vh - 32px);
      max-height: 860px;
      background: var(--app-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow:
        0 2px 8px var(--shadow),
        0 12px 40px var(--shadow);
    }

    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border2);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--rose-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    header h1 {
      font-family: 'Lora', serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--terracotta);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .header-pill {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--rose-light);
      color: var(--terracotta);
      border: 1px solid var(--rose-mid);
      letter-spacing: 0.2px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .xai-btn {
      margin-left: 8px;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--chat-bg);
      color: var(--text2);
      cursor: pointer;
    }

    main {
      flex: 1;
      display: flex;
      min-height: 0;
      background: var(--chat-bg);
    }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--rose-mid); border-radius: 4px; }

    .row { display: flex; }
    .row.you { justify-content: flex-end; }
    .row.bot { flex-direction: column; align-items: flex-start; }
    .row.sys { justify-content: flex-start; }

    .bot-wrap {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      max-width: 82%;
    }

    .bot-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--rose-light);
      border: 1.5px solid var(--rose-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      background: var(--app-bg);
    }

    .you .bubble {
      background: var(--terracotta);
      color: #fff;
      border-radius: 18px 4px 18px 18px;
      max-width: 75%;
    }

    .bot-wrap .bubble {
      border: 1px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      box-shadow: 0 1px 4px var(--shadow);
    }

    .sys .bubble {
      background: var(--amber-light);
      border: 1px solid #f0cfa0;
      border-left: 3px solid var(--amber);
      border-radius: 8px;
      color: #7a4a18;
      font-size: 13px;
      max-width: 88%;
      padding: 10px 13px;
    }

    .error .bubble {
      background: #fde8e8;
      border: 1px solid #f5b8b8;
      border-radius: 8px;
      color: #8a2020;
      font-size: 13px;
    }

    .myth-card {
      border-radius: 4px 18px 18px 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.65;
      box-shadow: 0 1px 4px var(--shadow);
    }

    .myth-section {
      background: #fdf0f0;
      border-bottom: 1px solid #f5cece;
      border-left: 4px solid #d75a5a;
      padding: 12px 15px;
    }

    .fact-section {
      background: var(--green-light);
      border-left: 4px solid #3c6c50;
      padding: 12px 15px;
    }

    .myth-badge,
    .fact-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 9px;
      border-radius: 20px;
      margin-bottom: 7px;
    }

    .myth-badge {
      background: #f5cece;
      color: #7a2020;
    }

    .fact-badge {
      background: #b8dfc8;
      color: #1e4a30;
    }

    .myth-section p, .fact-section p { margin: 0; color: var(--text); }

    .feedback-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 6px;
      padding-left: 39px;
    }

    .feedback-label {
      font-size: 11px;
      color: var(--muted);
    }

    .thumb-btn {
      background: var(--app-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 9px;
      cursor: pointer;
      font-size: 13px;
      color: var(--muted);
      transition: all 0.15s;
      line-height: 1;
    }

    .thumb-btn:hover { border-color: var(--rose); background: var(--rose-light); }
    .thumb-btn.active-up { border-color: var(--green); background: var(--green-light); }
    .thumb-btn.active-down { border-color: var(--rose); background: var(--rose-light); }

    .feedback-thanks { font-size: 11px; color: var(--green); }

    .facts-card {
      background: var(--app-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--terracotta2);
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 12px;
      color: var(--text2);
      max-width: 84%;
    }

    .facts-title {
      font-weight: 600;
      color: var(--terracotta);
      margin-bottom: 6px;
      font-size: 12px;
    }

    .facts-list {
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .typing {
      font-size: 13px;
      color: var(--muted);
      padding: 10px 14px;
      background: var(--app-bg);
      border: 1px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      display: inline-block;
    }

    .dots { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: middle; }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--rose-mid);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-5px); }
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      font-size: 12px;
      padding: 5px 13px;
      border-radius: 20px;
      background: var(--rose-light);
      border: 1px solid var(--rose-mid);
      color: var(--terracotta);
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: background 0.15s, color 0.15s;
    }

    .chip:hover { background: var(--rose-mid); color: #fff; }

    .composer {
      background: var(--composer-bg);
      border-top: 1px solid var(--border2);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
    }

    .inputRow { display: flex; gap: 8px; align-items: center; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #msg {
      flex: 1;
      padding: 11px 16px;
      border-radius: 24px;
      border: 1.5px solid var(--border);
      background: var(--chat-bg);
      color: var(--text);
      font-size: 14px;
      font-family: 'Nunito', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    #msg:focus { border-color: var(--rose-mid); }
    #msg::placeholder { color: var(--muted); }

    #send {
      padding: 11px 22px;
      border-radius: 24px;
      border: none;
      background: var(--terracotta);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: 'Nunito', sans-serif;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    #send:hover   { background: var(--terracotta2); }
    #send:active  { transform: scale(0.97); }
    #send:disabled { background: var(--rose-mid); cursor: not-allowed; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .controls label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .controls input[type="checkbox"] { accent-color: var(--terracotta); }

    #statusBadge { color: var(--green); font-size: 11px; }

    .bubble ul { padding-left: 18px; margin-top: 4px; }
    .bubble li { margin-bottom: 3px; }

    .culture-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .culture-row label { font-weight: 500; }

    .culture-row select {
      padding: 6px 10px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--chat-bg);
      font-size: 12px;
      color: var(--text2);
    }

    @media (max-width: 600px) {
      body { padding: 0; }
      .app { border-radius: 0; height: 100vh; max-height: none; }
      .bot-wrap { max-width: 94%; }
      .you .bubble { max-width: 88%; }
      .header-pill { display: none; }
    }
  </style>
</head>

<body>
<div class="app" role="application" aria-label="Menstrual health chatbot">

  <header>
    <div class="header-icon" aria-hidden="true">&#127800;</div>
    <div>
      <h1>Menstrual Health Chatbot</h1>
      <div class="subtitle">Ontology-driven &bull; Culturally aware &bull; Grounded responses</div>
    </div>
    <button type="button" class="xai-btn" id="xaiToggle" aria-label="Explain how I answered" aria-controls="xaiPanel" aria-expanded="false">&#128269; Explain</button>
    <span class="header-pill">Sri Lanka</span>
  </header>

  <main aria-label="Chat conversation area">
    <section id="chat" aria-live="polite" aria-label="Chat messages"></section>

    <aside id="xaiPanel" aria-label="How I answered" hidden>
      <!-- XAI panel content is injected by JavaScript -->
    </aside>
  </main>

  <div class="composer">
    <div class="culture-row">
      <label for="cultureSelect">Cultural context:</label>
      <select id="cultureSelect" aria-label="Select cultural context">
        <option value="srilankan" selected>Sri Lankan</option>
        <option value="southasian">South Asian</option>
        <option value="western">Western</option>
        <option value="conservative">Conservative</option>
        <option value="general">General</option>
      </select>
    </div>
    <div class="inputRow">
      <label class="sr-only" for="msg">Ask a menstrual health question</label>
      <input id="msg" type="text" placeholder="Ask a menstrual health question..." autocomplete="off" aria-label="Message to menstrual health chatbot" />
      <button id="send" type="button" disabled aria-label="Send message">Send</button>
    </div>
    <div class="controls">
      <label for="showFacts"><input type="checkbox" id="showFacts" /> Show ontology facts</label>
      <span id="sessionBadge" aria-label="Session identifier">Session: &mdash;</span>
      <span id="statusBadge" aria-live="polite">&#9679; Ready</span>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
